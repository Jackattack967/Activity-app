name: Diagnose why the app is unreachable

# TEMPORARY, and separate from wake-and-check on purpose: that workflow is
# the alerting safety net and must not be edited while it is the only thing
# still running.
#
# wake-and-check reports only "could not reach the endpoint after 6
# attempts". The status code behind that is the whole diagnosis — a 503
# means Render, a 500 means the app booted and threw, and no connection at
# all means nothing is listening — and it is written to a log stored on a
# host that cannot be read from the environment doing the investigating.
#
# So this reports the codes somewhere readable. It never prints the URL or
# the token in it: only the status code, the timings, and the size of what
# came back.

# Needed to post the report back; without it the POST is refused and the
# job still succeeds, which is how the first run produced nothing.
permissions:
  contents: write

on:
  push:
    paths:
      - ".github/workflows/diagnose-app.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the app what it is doing
        env:
          WATCH_CHECK_URL: ${{ secrets.WATCH_CHECK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$WATCH_CHECK_URL" ]; then
            echo "WATCH_CHECK_URL is not set in this repository." > /tmp/report.txt
          else

            # The host alone, so the report can say whether DNS even resolves
            # without ever echoing the path or its token.
            host=$(printf '%s' "$WATCH_CHECK_URL" | sed -E 's#^https?://##; s#[/?].*##')

            {
              echo "Host: $host"
              echo "Resolves: $(getent hosts "$host" >/dev/null 2>&1 && echo yes || echo no)"
              echo ""
            } > /tmp/report.txt

            for attempt in 1 2 3; do
              # %{http_code} is 000 when no HTTP response arrived at all,
              # and curl's own exit code then says why.
              out=$(curl -sS -o /tmp/body.txt -w '%{http_code} %{time_total}s %{size_download}B' \
                      --max-time 120 "$WATCH_CHECK_URL" 2>/tmp/err.txt) || true
              code=$?
              echo "Attempt $attempt: ${out:-no response}  (curl exit $code)" >> /tmp/report.txt
              if [ -s /tmp/err.txt ]; then
                echo "  curl said: $(head -c 200 /tmp/err.txt)" >> /tmp/report.txt
            fi
            # Only the shape of the body, never its contents: an error page
            # from the app could echo the request back, token and all.
            if [ -s /tmp/body.txt ]; then
              echo "  body starts: $(head -c 80 /tmp/body.txt | tr -d '\n' | sed 's/[^ -~]//g')" \
                >> /tmp/report.txt
            fi
            sleep 10
          done

            # The watch endpoint needs the database. The dashboard does
            # not — app.py disables accounts and keeps serving the
            # schedule on purpose — so these say whether visitors are
            # affected at all, or only alerting is.
            echo "" >> /tmp/report.txt
            for path in "/" "/api/events" "/api/watch-status" "/api/version"; do
              out=$(curl -sS -o /tmp/b.txt -w '%{http_code} %{time_total}s %{size_download}B' \
                      --max-time 120 "https://$host$path" 2>/dev/null) || true
              echo "GET $path -> ${out:-no response}" >> /tmp/report.txt
              if [ "$path" = "/api/version" ] && [ -s /tmp/b.txt ]; then
                echo "  $(head -c 200 /tmp/b.txt)" >> /tmp/report.txt
              fi
            done

            # Whether compression is live. curl sends no Accept-Encoding
            # unless asked, so the sizes above are always uncompressed and
            # say nothing about it either way.
            echo "" >> /tmp/report.txt
            enc=$(curl -sS -o /dev/null -H 'Accept-Encoding: gzip' \
                    -w '%{http_code} %{size_download}B enc=%{content_type}' \
                    --max-time 120 "https://$host/" 2>/dev/null) || true
            echo "GET / with gzip offered -> ${enc:-no response}" >> /tmp/report.txt
            hdr=$(curl -sSI -H 'Accept-Encoding: gzip' --max-time 120 \
                    "https://$host/" 2>/dev/null | grep -i '^content-encoding' || true)
            echo "  content-encoding: ${hdr:-none}" >> /tmp/report.txt

          fi

          cat /tmp/report.txt

          {
            printf '### Why the app is unreachable\n\n```\n'
            cat /tmp/report.txt
            printf '```\n'
          } > /tmp/comment.md
          jq -Rs '{body: .}' /tmp/comment.md > /tmp/payload.json
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -d @/tmp/payload.json -o /dev/null -w 'Posted: HTTP %{http_code}\n'
