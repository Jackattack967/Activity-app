# Render Blueprint — lets Render configure this service automatically
# from repo contents instead of you clicking through dashboard settings.
# See: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: activity-schedule-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: this app keeps its schedule cache in memory, so a
    # single worker keeps that cache coherent and avoids re-scraping
    # the source portal redundantly across processes.
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # These are secrets — sync:false means Render will prompt you to enter
      # them once in the dashboard rather than storing them in this file.
      #
      # Every env var the app needs must be declared here: this service is
      # Blueprint-managed, so Render reconciles its environment against this
      # list and will not keep variables added in the dashboard alone.
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      # Web Push (spot-opened alerts).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIM_EMAIL
        sync: false
      # Shared secret the external scheduler presents to /api/check-watches.
      - key: WATCH_CHECK_TOKEN
        sync: false
      # Email alerts. Optional: without a provider key the feature stays
      # hidden and inert, and push alerts are unaffected.
      #
      # Brevo is preferred and takes precedence — its free tier verifies a
      # single sender address and then delivers to any recipient, whereas an
      # unverified Resend account can only email the account owner.
      # ALERT_FROM_EMAIL must be the sender address verified with Brevo.
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_FROM_EMAIL
        sync: false
      # CASL requires every alert email to identify who sent it and give a
      # mailing address where they can be reached. Both are kept out of the
      # repo: a real postal address must not be committed to a public repo.
      # Without both set, alert emails are refused rather than sent
      # non-compliant; push notifications are unaffected.
      - key: SENDER_NAME
        sync: false
      - key: SENDER_MAILING_ADDRESS
        sync: false
      # Base URL used to build unsubscribe links in emails. Render sets
      # RENDER_EXTERNAL_URL automatically, so this is only needed once a
      # custom domain replaces the onrender.com address.
      - key: PUBLIC_BASE_URL
        sync: false
      # Address shown as the privacy contact on /privacy and /account/delete.
      # Not a secret, but kept out of the repo so a public repo doesn't
      # publish it. Prefer a role address over a personal one.
      - key: CONTACT_EMAIL
        sync: false
      # Arms the daily retention job. Unset (the default) it only reports
      # which unused accounts it *would* warn and delete, changing nothing.
      # Set to "true" once the dry-run output has been checked for a while.
      - key: RETENTION_ENABLED
        sync: false
      # Leave blank to keep the in-app watch loop on (the default). Set to
      # "false" only to fall back to the external scheduler alone.
      - key: AUTOWATCH_ENABLED
        sync: false
